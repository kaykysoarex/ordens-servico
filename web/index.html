<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a6d8c">
<title>FrioOS · Ordens de Serviço</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></svg></span>
      <div><h1>FrioOS</h1><span class="sub">Ordens de serviço e garantia</span></div>
    </div>
    <button id="bDados">Dados</button>
  </div>
  <div class="tools"><input type="search" id="busca" placeholder="Buscar cliente, modelo, defeito ou nº" aria-label="Buscar"><button class="pri" id="bNova">＋ Nova ordem</button></div>
  <div class="chips" id="chips"></div>
</div></header>

<main class="wrap">
  <section class="stats" id="stats"></section>
  <section class="grid" id="lista"></section>
</main>

<dialog id="dNova"><form method="dialog" id="fNova">
  <h2>Nova ordem</h2>
  <label for="nNome">Cliente</label><input id="nNome" required>
  <label for="nTel">Telefone</label><input id="nTel" type="tel" required>
  <label for="nTipo">Equipamento</label><select id="nTipo"><option>GELADEIRA</option><option>FREEZER</option><option>EXPOSITOR</option><option>OUTRO</option></select>
  <label for="nModelo">Marca / modelo</label><input id="nModelo" required>
  <label for="nDefeito">Defeito relatado</label><input id="nDefeito" required>
  <label for="nPrazo">Prazo de atendimento (dias)</label><input id="nPrazo" type="number" min="1" value="3" required>
  <div class="fim"><button type="button" data-fechar>Cancelar</button><button class="pri" value="ok">Abrir ordem</button></div>
</form></dialog>

<dialog id="dItem"><form method="dialog" id="fItem">
  <h2>Adicionar item</h2>
  <label for="iDesc">Peça ou serviço</label><input id="iDesc" required>
  <label for="iQtd">Quantidade</label><input id="iQtd" type="number" min="1" value="1" required>
  <label for="iPreco">Preço unitário (R$)</label><input id="iPreco" type="number" min="0" step="0.01" required>
  <div class="fim"><button type="button" data-fechar>Cancelar</button><button class="pri" value="ok">Adicionar</button></div>
</form></dialog>

<dialog id="dDados">
  <h2>Dados</h2>
  <p class="mut">Tudo fica salvo neste navegador. Para levar ou trazer dados (inclusive do programa Java, opção 10), use o JSON.</p>
  <label for="json">JSON</label><textarea id="json" rows="6"></textarea>
  <p class="bad" id="erro"></p>
  <div class="fim">
    <button id="bImp">Importar</button><button id="bExp">Baixar</button><button id="bEx">Carregar exemplo</button>
    <button class="perigo" id="bLimpa">Apagar tudo</button><button type="button" data-fechar>Fechar</button>
  </div>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
